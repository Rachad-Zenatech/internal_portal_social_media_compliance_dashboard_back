services:
  db:
    image: postgres:17
    container_name: social_media_db_local
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: social_media_compliance_dev
    ports:
      - "3008:5432"
    volumes:
      - social_media_db_data_17:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d social_media_compliance_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@db:5432/social_media_compliance_restored"
      AUTO_MIGRATE_SCHEMA: "true"
      WATCHFILES_FORCE_POLLING: "true"
    command: ["uvicorn", "server:app", "--host", "0.0.0.0", "--port", "8009", "--reload"]
    volumes:
      - .:/app
      - social_media_backend_data:/app/.data
    ports:
      - "8009:8009"
    depends_on:
      db:
        condition: service_healthy

volumes:
  social_media_db_data_17:
  social_media_backend_data:
