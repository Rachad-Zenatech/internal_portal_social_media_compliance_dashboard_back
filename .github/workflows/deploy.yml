name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpq-dev \
            gcc \
            curl

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
          pip install ruff

      - name: Check Python Syntax
        run: |
          python -m py_compile server.py

      # Real errors fail the build: syntax errors and undefined names.
      - name: Ruff (errors)
        run: |
          ruff check . --select E9,F63,F7,F82

      # Style issues are reported but don't block yet (there's a backlog of them to clear first).
      - name: Ruff (style report)
        run: |
          ruff check . --ignore E501 --statistics || true

      # Unit tests (unittest style): the database and Gemini are mocked, so no services
      # are needed. A failing test fails the build.
      - name: Run Pytest
        run: |
          pytest -q

      # Input screening, PII redaction, model routing and cache checks against labelled cases (offline, no Gemini).
      - name: AI safety eval
        run: |
          python scripts/ai_safety_eval.py

  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: social-media-backend-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  verify-migrations-and-diffs:
    name: Verify Migrations & Schema Diffs
    runs-on: ubuntu-latest
    needs: [lint-and-test]
    services:
      postgres:
        image: postgres:alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: social_media_compliance_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install asyncpg psycopg2-binary alembic

      - name: Initialize base schema and run migrations
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/social_media_compliance_dev
          DATABASE_SSL: false
        run: |
          python -c "
          import asyncio
          from postgresql_db.database import create_pool, close_pool
          from services.shared.core.startup_service import run_schema_setups

          async def main():
              await create_pool()
              await run_schema_setups()
              await close_pool()

          asyncio.run(main())
          "
          alembic stamp head
          alembic upgrade head

          echo "[*] Database schema verification complete!"

  deploy-ec2:
    name: Deploy to EC2
    environment: Zenatech
    needs: [lint-and-test, docker-build, verify-migrations-and-diffs]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY: ${{ secrets.AWS_ACCESS_KEY || secrets.AWS_ACCESS_KEY_ID || secrets.ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY || secrets.SECRET_ACCESS_KEY }}
      AWS_SECURITY_GROUP_ID: ${{ secrets.AWS_SECURITY_GROUP_ID || vars.AWS_SECURITY_GROUP_ID }}

    steps:
      - name: Get GitHub runner IP
        id: ip
        run: echo "ipv4=$(curl -s https://api.ipify.org)" >> $GITHUB_OUTPUT

      - name: Configure AWS credentials
        if: env.AWS_ACCESS_KEY != '' && env.AWS_SECRET_ACCESS_KEY != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || vars.AWS_REGION || 'ca-central-1' }}

      - name: Authorize Security Group SSH
        if: env.AWS_ACCESS_KEY != '' && env.AWS_SECURITY_GROUP_ID != ''
        run: |
          aws ec2 authorize-security-group-ingress \
            --group-id ${{ env.AWS_SECURITY_GROUP_ID }} \
            --protocol tcp --port 22 --cidr ${{ steps.ip.outputs.ipv4 }}/32 || true

      - name: Deploy backend to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER || 'ec2-user' }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_SSL: ${{ secrets.DATABASE_SSL || 'require' }}
          DB_POOL_MIN_SIZE: ${{ vars.DB_POOL_MIN_SIZE || '5' }}
          DB_POOL_MAX_SIZE: ${{ vars.DB_POOL_MAX_SIZE || '20' }}
          DB_POOL_MAX_QUERIES: ${{ vars.DB_POOL_MAX_QUERIES || '50000' }}
          DB_POOL_MAX_INACTIVE_LIFETIME: ${{ vars.DB_POOL_MAX_INACTIVE_LIFETIME || '300.0' }}
          DB_COMMAND_TIMEOUT: ${{ vars.DB_COMMAND_TIMEOUT || '120.0' }}
          DB_POOL_ACQUIRE_TIMEOUT: ${{ vars.DB_POOL_ACQUIRE_TIMEOUT || '10.0' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          MICROSOFT_CLIENT_ID: ${{ secrets.MICROSOFT_CLIENT_ID }}
          MICROSOFT_CLIENT_SECRET: ${{ secrets.MICROSOFT_CLIENT_SECRET }}
          MICROSOFT_TENANT_ID: ${{ secrets.MICROSOFT_TENANT_ID }}
          MICROSOFT_AUTHORITY: ${{ secrets.MICROSOFT_AUTHORITY }}
          MICROSOFT_REDIRECT_URI: ${{ secrets.MICROSOFT_REDIRECT_URI }}
          FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
          CORS_ALLOWED_ORIGINS: ${{ secrets.CORS_ALLOWED_ORIGINS || secrets.FRONTEND_URL }}
          AWS_S3_BUCKET_NAME: ${{ secrets.AWS_S3_BUCKET_NAME }}
          AWS_S3_REGION: ${{ secrets.AWS_S3_REGION || 'ca-central-1' }}
          AWS_ACCESS_KEY_ID: ${{ env.AWS_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ env.AWS_SECRET_ACCESS_KEY }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          CEO_DASHBOARD_API_URL: ${{ secrets.CEO_DASHBOARD_API_URL }}
          M7A_PORT: ${{ secrets.M7A_PORT || vars.M7A_PORT || '8000' }}
          M7A_BACKEND_URL: ${{ secrets.M7A_BACKEND_URL || vars.M7A_BACKEND_URL || 'http://host.docker.internal:8000' }}
          M7A_INTEGRATION_TIMEOUT_SECONDS: ${{ secrets.M7A_INTEGRATION_TIMEOUT_SECONDS || '2.0' }}
          MQTT_HOST: ${{ secrets.MQTT_HOST || 'mqtt' }}
          MQTT_PORT: ${{ secrets.MQTT_PORT || '1883' }}
          MQTT_USERNAME: ${{ secrets.MQTT_USERNAME }}
          MQTT_PASSWORD: ${{ secrets.MQTT_PASSWORD }}
          MQTT_USE_TLS: ${{ secrets.MQTT_USE_TLS || 'false' }}
          SERVICE_NAME: ${{ secrets.SERVICE_NAME || 'social-media' }}
          SERVICE_INSTANCE_ID: ${{ secrets.SERVICE_INSTANCE_ID || 'social-media-01' }}
          RABBITMQ_HOST: ${{ secrets.RABBITMQ_HOST || 'rabbitmq' }}
          RABBITMQ_PORT: ${{ secrets.RABBITMQ_PORT || '5672' }}
          RABBITMQ_DEFAULT_USER: ${{ secrets.RABBITMQ_DEFAULT_USER || secrets.RABBITMQ_USER }}
          RABBITMQ_DEFAULT_PASS: ${{ secrets.RABBITMQ_DEFAULT_PASS || secrets.RABBITMQ_PASSWORD }}
          RABBITMQ_URL: ${{ secrets.RABBITMQ_URL || 'amqp://guest:guest@host.docker.internal:5672/' }}
          PLAYWRIGHT_BROWSERS_PATH: ${{ secrets.PLAYWRIGHT_BROWSERS_PATH || '/ms-playwright' }}
          UPLOAD_S3_PREFIX: ${{ secrets.UPLOAD_S3_PREFIX || 'data' }}
          GEMINI_AVAILABLE_MODELS: ${{ secrets.GEMINI_AVAILABLE_MODELS || 'Gemini 2.5 Flash,Gemini 3.6 Flash,Gemini 3.5 Flash' }}
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY || secrets.SENDGRIP_API_KEY }}
          MAIL_FROM_ADDRESS: ${{ secrets.MAIL_FROM_ADDRESS || vars.MAIL_FROM_ADDRESS }}
          MAIL_FROM_NAME: ${{ secrets.MAIL_FROM_NAME || vars.MAIL_FROM_NAME }}
          SENDGRID_SANDBOX_MODE: ${{ secrets.SENDGRID_SANDBOX_MODE || vars.SENDGRID_SANDBOX_MODE }}
          SHARE_DOCUMENT_URL: ${{ secrets.SHARE_DOCUMENT_URL || vars.SHARE_DOCUMENT_URL }}
          SCRIPT_SERVICE_SECRET: ${{ secrets.SCRIPT_SERVICE_SECRET }}
          SCRIPT_EDITOR: ${{ secrets.SCRIPT_EDITOR || vars.SCRIPT_EDITOR }}
        run: |
          install -m 600 /dev/null ec2-key.pem
          printf '%s\n' "$EC2_SSH_KEY" > ec2-key.pem

          ssh -o StrictHostKeyChecking=no -i ec2-key.pem "$EC2_USER@$EC2_HOST" "
            if [ ! -d ~/internal_portal_social_media_compliance_dashboard_back/.git ]; then
              git clone https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git ~/internal_portal_social_media_compliance_dashboard_back
            else
              sudo chown -R "$EC2_USER:$EC2_USER" ~/internal_portal_social_media_compliance_dashboard_back 2>/dev/null || true
              cd ~/internal_portal_social_media_compliance_dashboard_back && \
              git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git && \
              git fetch origin main && \
              git reset --hard origin/main
            fi
          "

          {
            echo "APP_ENV=production"
            echo "LOG_LEVEL=INFO"
            printf 'DATABASE_URL=%s\n' "$DATABASE_URL"
            printf 'DATABASE_SSL=%s\n' "$DATABASE_SSL"
            printf 'DB_POOL_MIN_SIZE=%s\n' "$DB_POOL_MIN_SIZE"
            printf 'DB_POOL_MAX_SIZE=%s\n' "$DB_POOL_MAX_SIZE"
            printf 'DB_POOL_MAX_QUERIES=%s\n' "$DB_POOL_MAX_QUERIES"
            printf 'DB_POOL_MAX_INACTIVE_LIFETIME=%s\n' "$DB_POOL_MAX_INACTIVE_LIFETIME"
            printf 'DB_COMMAND_TIMEOUT=%s\n' "$DB_COMMAND_TIMEOUT"
            printf 'DB_POOL_ACQUIRE_TIMEOUT=%s\n' "$DB_POOL_ACQUIRE_TIMEOUT"
            printf 'GEMINI_API_KEY=%s\n' "$GEMINI_API_KEY"
            printf 'SESSION_SECRET=%s\n' "$SESSION_SECRET"
            printf 'MICROSOFT_CLIENT_ID=%s\n' "$MICROSOFT_CLIENT_ID"
            printf 'MICROSOFT_CLIENT_SECRET=%s\n' "$MICROSOFT_CLIENT_SECRET"
            printf 'MICROSOFT_TENANT_ID=%s\n' "$MICROSOFT_TENANT_ID"
            if [ -n "$MICROSOFT_AUTHORITY" ]; then
              printf 'MICROSOFT_AUTHORITY=%s\n' "$MICROSOFT_AUTHORITY"
            elif [ -n "$MICROSOFT_TENANT_ID" ]; then
              printf 'MICROSOFT_AUTHORITY=https://login.microsoftonline.com/%s\n' "$MICROSOFT_TENANT_ID"
            fi
            printf 'MICROSOFT_REDIRECT_URI=%s\n' "$MICROSOFT_REDIRECT_URI"
            printf 'FRONTEND_URL=%s\n' "$FRONTEND_URL"
            printf 'CORS_ALLOWED_ORIGINS=%s\n' "$CORS_ALLOWED_ORIGINS"
            printf 'AWS_S3_BUCKET_NAME=%s\n' "$AWS_S3_BUCKET_NAME"
            printf 'AWS_S3_REGION=%s\n' "$AWS_S3_REGION"
            if [ -n "$AWS_ACCESS_KEY_ID" ]; then
              printf 'AWS_ACCESS_KEY_ID=%s\n' "$AWS_ACCESS_KEY_ID"
            fi
            if [ -n "$AWS_SECRET_ACCESS_KEY" ]; then
              printf 'AWS_SECRET_ACCESS_KEY=%s\n' "$AWS_SECRET_ACCESS_KEY"
            fi
            if [ -n "$MONGODB_URI" ]; then
              printf 'MONGODB_URI=%s\n' "$MONGODB_URI"
            fi
            if [ -n "$CEO_DASHBOARD_API_URL" ]; then
              printf 'CEO_DASHBOARD_API_URL=%s\n' "$CEO_DASHBOARD_API_URL"
            fi
            printf 'M7A_PORT=%s\n' "$M7A_PORT"
            printf 'M7A_BACKEND_URL=%s\n' "$M7A_BACKEND_URL"
            printf 'M7A_INTEGRATION_TIMEOUT_SECONDS=%s\n' "$M7A_INTEGRATION_TIMEOUT_SECONDS"
            printf 'MQTT_HOST=%s\n' "$MQTT_HOST"
            printf 'MQTT_PORT=%s\n' "$MQTT_PORT"
            printf 'MQTT_USERNAME=%s\n' "$MQTT_USERNAME"
            printf 'MQTT_PASSWORD=%s\n' "$MQTT_PASSWORD"
            printf 'MQTT_USE_TLS=%s\n' "$MQTT_USE_TLS"
            printf 'SERVICE_NAME=%s\n' "$SERVICE_NAME"
            printf 'SERVICE_INSTANCE_ID=%s\n' "$SERVICE_INSTANCE_ID"
            if [ -n "$RABBITMQ_HOST" ]; then
              printf 'RABBITMQ_HOST=%s\n' "$RABBITMQ_HOST"
            fi
            if [ -n "$RABBITMQ_PORT" ]; then
              printf 'RABBITMQ_PORT=%s\n' "$RABBITMQ_PORT"
            fi
            if [ -n "$RABBITMQ_DEFAULT_USER" ]; then
              printf 'RABBITMQ_DEFAULT_USER=%s\n' "$RABBITMQ_DEFAULT_USER"
            fi
            if [ -n "$RABBITMQ_DEFAULT_PASS" ]; then
              printf 'RABBITMQ_DEFAULT_PASS=%s\n' "$RABBITMQ_DEFAULT_PASS"
            fi
            if [ -n "$RABBITMQ_URL" ]; then
              printf 'RABBITMQ_URL=%s\n' "$RABBITMQ_URL"
            fi
            printf 'PLAYWRIGHT_BROWSERS_PATH=%s\n' "$PLAYWRIGHT_BROWSERS_PATH"
            printf 'UPLOAD_S3_PREFIX=%s\n' "$UPLOAD_S3_PREFIX"
            printf 'GEMINI_AVAILABLE_MODELS=%s\n' "$GEMINI_AVAILABLE_MODELS"
            if [ -n "$SENDGRID_API_KEY" ]; then
              printf 'SENDGRID_API_KEY=%s\n' "$SENDGRID_API_KEY"
            fi
            if [ -n "$MAIL_FROM_ADDRESS" ]; then
              printf 'MAIL_FROM_ADDRESS=%s\n' "$MAIL_FROM_ADDRESS"
            fi
            if [ -n "$MAIL_FROM_NAME" ]; then
              printf 'MAIL_FROM_NAME=%s\n' "$MAIL_FROM_NAME"
            fi
            if [ -n "$SENDGRID_SANDBOX_MODE" ]; then
              printf 'SENDGRID_SANDBOX_MODE=%s\n' "$SENDGRID_SANDBOX_MODE"
            fi
            if [ -n "$SHARE_DOCUMENT_URL" ]; then
              printf 'SHARE_DOCUMENT_URL=%s\n' "$SHARE_DOCUMENT_URL"
            fi
            if [ -n "$SCRIPT_SERVICE_SECRET" ]; then
              printf 'SCRIPT_SERVICE_SECRET=%s\n' "$SCRIPT_SERVICE_SECRET"
            fi
            if [ -n "$SCRIPT_EDITOR" ]; then
              printf 'SCRIPT_EDITOR=%s\n' "$SCRIPT_EDITOR"
            fi
            echo "DATA_PATH=/app/data"
            echo "UPLOAD_FILES_DIR=/app/data/upload_files"
            echo "AUTH_COOKIE_SECURE=true"
            echo "SESSION_COOKIE_SECURE=true"
          } > .env.production

          scp -o StrictHostKeyChecking=no -i ec2-key.pem .env.production "$EC2_USER@$EC2_HOST":~/internal_portal_social_media_compliance_dashboard_back/.env.production

          ssh -o StrictHostKeyChecking=no -i ec2-key.pem "$EC2_USER@$EC2_HOST" "
            cd ~/internal_portal_social_media_compliance_dashboard_back
            sudo mkdir -p data data/upload_files
            sudo chown -R 10001:10001 data 2>/dev/null || sudo chmod -R 777 data

            # Ensure EC2 IMDSv2 hop limit is 2 so Docker container can access IAM role
            TOKEN=\$(curl -s -X PUT 'http://169.254.169.254/latest/api/token' -H 'X-aws-ec2-metadata-token-ttl-seconds: 60' 2>/dev/null || true)
            if [ -n \"\$TOKEN\" ]; then
              INSTANCE_ID=\$(curl -s -H \"X-aws-ec2-metadata-token: \$TOKEN\" http://169.254.169.254/latest/meta-data/instance-id 2>/dev/null || true)
              if [ -n \"\$INSTANCE_ID\" ]; then
                aws ec2 modify-instance-metadata-options --instance-id \"\$INSTANCE_ID\" --http-put-response-hop-limit 2 --http-endpoint enabled 2>/dev/null || true
              fi
            fi

            # Each deploy leaves the previous image dangling plus build cache; prune
            # before building so the disk does not fill up and fail the image export.
            echo 'Disk before cleanup:'; df -h /
            sudo docker container prune -f || true
            sudo docker image prune -f || true
            sudo docker builder prune -f --filter until=24h || true
            echo 'Disk after cleanup:'; df -h /

            sudo docker build -t social-media-backend-api:latest .
            echo '[*] Applying database migrations on EC2...'
            # Stop the deploy if migrations fail: starting new code against an un-migrated
            # database breaks the live site (e.g. missing columns), so keep the old container.
            if ! sudo docker run --rm --env-file .env.production social-media-backend-api:latest alembic upgrade head; then
              echo '::error title=Migrations failed::alembic upgrade head failed. Deploy stopped; the previous container is still running.'
              exit 1
            fi
            if docker compose version &>/dev/null; then
              sudo docker compose -f docker-compose.prod.yml up -d --remove-orphans
            elif command -v docker-compose &>/dev/null; then
              sudo docker-compose -f docker-compose.prod.yml up -d --remove-orphans
            else
              sudo curl -L \"https://github.com/docker/compose/releases/latest/download/docker-compose-\$(uname -s)-\$(uname -m)\" -o /usr/local/bin/docker-compose
              sudo chmod +x /usr/local/bin/docker-compose
              sudo /usr/local/bin/docker-compose -f docker-compose.prod.yml up -d --remove-orphans
            fi

            # Remove the image this deploy just replaced.
            sudo docker image prune -f || true
            echo 'Disk after deploy:'; df -h /
          "
          rm -f ec2-key.pem .env.production

      - name: Revoke Security Group SSH
        if: always() && env.AWS_ACCESS_KEY != '' && env.AWS_SECURITY_GROUP_ID != ''
        run: |
          aws ec2 revoke-security-group-ingress \
            --group-id ${{ env.AWS_SECURITY_GROUP_ID }} \
            --protocol tcp --port 22 --cidr ${{ steps.ip.outputs.ipv4 }}/32 || true
