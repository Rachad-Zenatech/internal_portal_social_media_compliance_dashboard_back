name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Let deployments finish, including SSH-rule cleanup.
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpq-dev \
            gcc \
            curl

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
          pip install ruff

      - name: Check Python Syntax
        run: |
          python -m py_compile server.py

      # Real errors fail the build: syntax errors and undefined names.
      - name: Ruff (errors)
        run: |
          ruff check . --select E9,F63,F7,F82

      # Style issues are reported but don't block yet (there's a backlog of them to clear first).
      - name: Ruff (style report)
        run: |
          ruff check . --ignore E501 --statistics || true

      # Unit tests (unittest style): the database and Gemini are mocked, so no services
      # are needed. A failing test fails the build.
      - name: Run Pytest
        run: |
          pytest -q

      # Input screening, PII redaction, model routing and cache checks against labelled cases (offline, no Gemini).
      - name: AI safety eval
        run: |
          python scripts/ai_safety_eval.py

  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: social-media-backend-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  verify-migrations-and-diffs:
    name: Verify Migrations & Schema Diffs
    runs-on: ubuntu-latest
    needs: [lint-and-test]
    services:
      postgres:
        image: postgres:alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: social_media_compliance_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install asyncpg psycopg2-binary alembic

      - name: Initialize base schema and run migrations
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/social_media_compliance_dev
          DATABASE_SSL: false
        run: |
          python -c "
          import asyncio
          from postgresql_db.database import create_pool, close_pool
          from services.shared.core.startup_service import run_schema_setups

          async def main():
              pool = await create_pool()
              try:
                  await run_schema_setups(pool)
              finally:
                  await close_pool()

          asyncio.run(main())
          "
          alembic stamp head
          alembic upgrade head

          echo "[*] Database schema verification complete!"

  deploy-ec2:
    name: Deploy to EC2
    environment: Zenatech
    needs: [lint-and-test, docker-build, verify-migrations-and-diffs]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - name: Load ENV_FILE variables
        shell: bash
        env:
          # Complete .env.production contents; application keys are passed through automatically.
          ENV_FILE: ${{ secrets.ENV_FILE || vars.ENV_FILE }}
          FALLBACK_AWS_ACCESS_KEY: ${{ secrets.AWS_ACCESS_KEY || secrets.AWS_ACCESS_KEY_ID || secrets.ACCESS_KEY }}
          FALLBACK_AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY || secrets.SECRET_ACCESS_KEY }}
          FALLBACK_AWS_REGION: ${{ secrets.AWS_REGION || vars.AWS_REGION || 'ca-central-1' }}
          FALLBACK_AWS_SECURITY_GROUP_ID: ${{ secrets.AWS_SECURITY_GROUP_ID || vars.AWS_SECURITY_GROUP_ID }}
          FALLBACK_EC2_HOST: ${{ secrets.EC2_HOST }}
          FALLBACK_EC2_USER: ${{ secrets.EC2_USER || vars.EC2_USER || 'ec2-user' }}
          FALLBACK_EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${ENV_FILE:-}" ]; then
            echo "::error::Set ENV_FILE in the Zenatech environment to the complete production .env contents."
            exit 1
          fi

          install -m 600 /dev/null .env.raw
          printf '%s\n' "$ENV_FILE" | tr -d '\r' > .env.raw

          python3 - <<'PY'
          import os, re, sys
          from pathlib import Path

          vals = {}
          raw_lines = Path(".env.raw").read_text(encoding="utf-8-sig").splitlines()
          i = 0
          while i < len(raw_lines):
              line = raw_lines[i].strip()
              i += 1
              if not line or line.startswith("#") or "=" not in line:
                  continue
              if line.startswith("export "):
                  line = line[7:].strip()
              k, v = line.split("=", 1)
              k = k.strip()
              v = v.strip()
              if k == "EC2_SSH_KEY" and "-----BEGIN" in v and "-----END" not in v:
                  key_lines = [v.lstrip("\"'")]
                  while i < len(raw_lines):
                      nxt = raw_lines[i]
                      i += 1
                      key_lines.append(nxt.rstrip("\"'"))
                      if "-----END" in nxt:
                          break
                  v = "\n".join(key_lines)
              elif len(v) >= 2 and v[0] == v[-1] and v[0] in ('"', "'"):
                  v = v[1:-1]
              if re.match(r"^[A-Za-z_][A-Za-z0-9_]*$", k):
                  vals[k] = v

          print("Loaded keys from ENV_FILE:", " ".join(vals.keys()), file=sys.stderr)

          # ENV_FILE is one GitHub value: mask its individual values before later steps can log them.
          for value in vals.values():
              if value:
                  masked = value.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
                  print(f"::add-mask::{masked}")

          ssh_key = vals.get("EC2_SSH_KEY") or os.environ.get("FALLBACK_EC2_SSH_KEY") or ""
          if "\\n" in ssh_key and "\n" not in ssh_key:
              ssh_key = ssh_key.replace("\\n", "\n")
          if ssh_key.strip():
              Path("ec2-key.pem").write_text(ssh_key.strip() + "\n", encoding="utf-8")
              Path("ec2-key.pem").chmod(0o600)

          deploy_only = {"EC2_HOST", "EC2_USER", "EC2_SSH_KEY", "AWS_SECURITY_GROUP_ID"}
          # Include every application setting, including empty values and future additions.
          # This covers DB pools, OAuth/cookies, AI routes, MongoDB, RabbitMQ, shared scripts and uploads.
          prod_env = {k: v for k, v in vals.items() if k not in deploy_only}
          prod_env.setdefault("APP_ENV", "production")

          Path(".env.production").write_text("\n".join(f"{k}={v}" for k, v in prod_env.items()) + "\n", encoding="utf-8")
          Path(".env.production").chmod(0o600)

          mapped = {
              "AWS_ACCESS_KEY_ID": vals.get("AWS_ACCESS_KEY_ID") or vals.get("AWS_ACCESS_KEY") or vals.get("ACCESS_KEY") or os.environ.get("FALLBACK_AWS_ACCESS_KEY") or "",
              "AWS_SECRET_ACCESS_KEY": vals.get("AWS_SECRET_ACCESS_KEY") or vals.get("SECRET_ACCESS_KEY") or os.environ.get("FALLBACK_AWS_SECRET_ACCESS_KEY") or "",
              "AWS_REGION": vals.get("AWS_REGION") or vals.get("REGION") or os.environ.get("FALLBACK_AWS_REGION") or "ca-central-1",
              "AWS_SECURITY_GROUP_ID": vals.get("AWS_SECURITY_GROUP_ID") or os.environ.get("FALLBACK_AWS_SECURITY_GROUP_ID") or "",
              "EC2_HOST": vals.get("EC2_HOST") or os.environ.get("FALLBACK_EC2_HOST") or "",
              "EC2_USER": vals.get("EC2_USER") or os.environ.get("FALLBACK_EC2_USER") or "ec2-user",
          }
          if not mapped["EC2_HOST"].strip() or not ssh_key.strip():
              sys.exit("EC2_HOST and EC2_SSH_KEY must be set in ENV_FILE (or Zenatech secrets).")

          # GITHUB_ENV makes these available to subsequent steps without evaluating dotenv values as shell code.
          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as github_env:
              for k, v in mapped.items():
                  value = v.strip()
                  if "\n" in value or "\r" in value:
                      sys.exit(f"{k} must be a single-line value.")
                  github_env.write(f"{k}={value}\n")
          PY

          rm -f .env.raw

      - name: Get GitHub runner IP
        id: ip
        run: echo "ipv4=$(curl -fsS https://api.ipify.org)" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        if: env.AWS_ACCESS_KEY_ID != '' && env.AWS_SECRET_ACCESS_KEY != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION || 'ca-central-1' }}

      - name: Authorize Security Group SSH
        if: env.AWS_ACCESS_KEY_ID != '' && env.AWS_SECRET_ACCESS_KEY != '' && env.AWS_SECURITY_GROUP_ID != ''
        run: |
          aws ec2 authorize-security-group-ingress \
            --group-id "$AWS_SECURITY_GROUP_ID" \
            --protocol tcp --port 22 --cidr "${{ steps.ip.outputs.ipv4 }}/32" || true

      - name: Deploy backend to EC2
        env:
          DEPLOY_TOKEN: ${{ github.token }}
          DEPLOY_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          ssh -o StrictHostKeyChecking=no -i ec2-key.pem "$EC2_USER@$EC2_HOST" "
            set -e
            mkdir -p ~/internal_portal_social_media_compliance_dashboard_back
            sudo chown -R \"$EC2_USER:$EC2_USER\" ~/internal_portal_social_media_compliance_dashboard_back 2>/dev/null || true
            cd ~/internal_portal_social_media_compliance_dashboard_back
            REPO_URL=https://x-access-token:$DEPLOY_TOKEN@github.com/$DEPLOY_REPOSITORY.git
            if [ ! -d .git ]; then
              git clone \"\$REPO_URL\" .
            else
              git remote set-url origin \"\$REPO_URL\"
              git fetch origin main
              git reset --hard origin/main
            fi
            # Agent/AI tooling lives in GitHub only: never keep it on the server.
            rm -rf .agents .cursor .claude .cursorrules AGENTS.md CLAUDE.md GEMINI.md .antigravityignore
            # Do not leave the temporary Actions token in the remote URL.
            git remote set-url origin https://github.com/$DEPLOY_REPOSITORY.git
            echo \"Deploying commit: \$(git rev-parse --short HEAD)\"
          "

          scp -o StrictHostKeyChecking=no -i ec2-key.pem .env.production "$EC2_USER@$EC2_HOST":~/internal_portal_social_media_compliance_dashboard_back/.env.production

          ssh -o StrictHostKeyChecking=no -i ec2-key.pem "$EC2_USER@$EC2_HOST" '
            set -e
            cd ~/internal_portal_social_media_compliance_dashboard_back
            chmod 600 .env.production
            sudo mkdir -p data data/upload_files data/uploads
            sudo chown -R 10001:10001 data 2>/dev/null || sudo chmod -R 777 data

            # Ensure EC2 IMDSv2 hop limit is 2 so Docker container can access IAM role
            TOKEN=$(curl -s -X PUT "http://169.254.169.254/latest/api/token" -H "X-aws-ec2-metadata-token-ttl-seconds: 60" 2>/dev/null || true)
            if [ -n "$TOKEN" ]; then
              INSTANCE_ID=$(curl -s -H "X-aws-ec2-metadata-token: $TOKEN" http://169.254.169.254/latest/meta-data/instance-id 2>/dev/null || true)
              if [ -n "$INSTANCE_ID" ]; then
                aws ec2 modify-instance-metadata-options --instance-id "$INSTANCE_ID" --http-put-response-hop-limit 2 --http-endpoint enabled 2>/dev/null || true
              fi
            fi

            # Each deploy leaves the previous image dangling plus build cache; prune
            # before building so the disk does not fill up and fail the image export.
            echo "Disk before cleanup:"; df -h /
            sudo docker container prune -f || true
            sudo docker image prune -f || true
            sudo docker builder prune -f --filter until=24h || true
            echo "Disk after cleanup:"; df -h /

            sudo docker build -t social-media-backend-api:latest .
            echo "[*] Applying database migrations on EC2..."
            # Stop the deploy if migrations fail: starting new code against an un-migrated
            # database breaks the live site (e.g. missing columns), so keep the old container.
            if ! sudo docker run --rm --env-file .env.production social-media-backend-api:latest alembic upgrade head; then
              echo "::error title=Migrations failed::alembic upgrade head failed. Deploy stopped; the previous container is still running."
              exit 1
            fi

            if sudo docker compose version >/dev/null 2>&1; then
              COMPOSE="sudo docker compose"
            elif sudo /usr/local/bin/docker-compose version >/dev/null 2>&1; then
              COMPOSE="sudo /usr/local/bin/docker-compose"
            else
              echo "Installing the Docker Compose plugin for root..."
              sudo mkdir -p /usr/local/lib/docker/cli-plugins
              sudo curl -fsSL "https://github.com/docker/compose/releases/latest/download/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/lib/docker/cli-plugins/docker-compose
              sudo chmod +x /usr/local/lib/docker/cli-plugins/docker-compose
              COMPOSE="sudo docker compose"
            fi

            $COMPOSE version
            $COMPOSE -f docker-compose.prod.yml config --quiet
            $COMPOSE -f docker-compose.prod.yml up -d --remove-orphans

            # Remove the image this deploy just replaced.
            sudo docker image prune -f || true
            echo "Disk after deploy:"; df -h /
          '

      - name: Cleanup local secrets
        if: always()
        run: rm -f ec2-key.pem .env.production .env.raw

      - name: Revoke Security Group SSH
        if: always() && env.AWS_ACCESS_KEY_ID != '' && env.AWS_SECRET_ACCESS_KEY != '' && env.AWS_SECURITY_GROUP_ID != '' && steps.ip.outputs.ipv4 != ''
        run: |
          aws ec2 revoke-security-group-ingress \
            --group-id "$AWS_SECURITY_GROUP_ID" \
            --protocol tcp --port 22 --cidr "${{ steps.ip.outputs.ipv4 }}/32" || true
