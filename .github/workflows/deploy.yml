name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpq-dev \
            gcc \
            curl

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
          pip install ruff

      - name: Check Python Syntax
        run: |
          python -m py_compile server.py

      # Real errors fail the build: syntax errors and undefined names.
      - name: Ruff (errors)
        run: |
          ruff check . --select E9,F63,F7,F82

      # Style issues are reported but don't block yet (there's a backlog of them to clear first).
      - name: Ruff (style report)
        run: |
          ruff check . --ignore E501 --statistics || true

      # Unit tests (unittest style, as in the finance backend): the database and Gemini are mocked, so no services
      # are needed. A failing test fails the build.
      - name: Run Pytest
        run: |
          pytest -q

  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    # Only build the image once lint and tests pass.
    needs: lint-and-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: backend-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
